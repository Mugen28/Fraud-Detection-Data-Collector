services:
  crawler:
    build: .
    container_name: arkm_iranian_crawler
    # Successful one-shot runs must stay stopped. The scheduler process
    # already loops; this only restarts a container that actually crashes.
    restart: on-failure:3
    environment:
      - PYTHONUNBUFFERED=1
      - ARKM_NO_AUTO_LOGIN=1
      - INTERVAL_HOURS=${INTERVAL_HOURS:-24}
      - JITTER_HOURS=${JITTER_HOURS:-2}
      - CLICKHOUSE_ENDPOINT=${CLICKHOUSE_ENDPOINT:-}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-default}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
      - CLICKHOUSE_STRICT=${CLICKHOUSE_STRICT:-false}
      - LOCAL_DB_PATH=${LOCAL_DB_PATH:-api_output/crawler_backup.db}
      - ENABLE_LOCAL_DB=${ENABLE_LOCAL_DB:-true}
    volumes:
      # Persist crawled datasets on host
      - ./api_output:/app/api_output
      # Mount session cookies generated on host
      - ./storage_state.json:/app/storage_state.json
    command: ${CRAWLER_CMD:-python3 run_pipeline.py}

